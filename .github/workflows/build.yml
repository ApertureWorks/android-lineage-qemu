name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: true
        type: string
        default: "self-hosted" # ubuntu-latest

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./build.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            recovery-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/recovery.img
            android/lineage/out/target/product/virtio_arm64only/boot.img
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip
            android/lineage/out/target/product/virtio_x86_64/*ota.zip

      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: |
            recovery-userdebug.img
            android/lineage/out/target/product/virtio_arm64only/recovery.img
            android/lineage/out/target/product/virtio_arm64only/boot.img
            android/lineage/out/target/product/virtio_arm64only/VirtualMachine/UTM/UTM-VM*.zip
            android/lineage/out/target/product/virtio_arm64only/*ota.zip
            android/lineage/out/target/product/virtio_x86_64/VirtualMachine/UTM/UTM-VM*.zip
            android/lineage/out/target/product/virtio_x86_64/*ota.zip
